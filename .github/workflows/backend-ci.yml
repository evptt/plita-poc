# Проверка бэкенда до мержа в main (сам main выкатывает deploy.yml).
#   test - сборка Maven и юнит-тесты;
#   e2e  - вся связка из infra/docker-compose.yml (Postgres, Mosquitto, Caddy, бэкенд) и сквозная проверка
#          tools/e2e_check.py: вход, Дом, пакеты датчика и реле, тревога, команды, push-токены, OTA.
name: backend-ci

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: infra/backend/pom.xml
      - name: Сборка и юнит-тесты
        run: mvn -B test

  e2e:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: .env для проверки (эмулятор выключен, вход без Google включён)
        working-directory: infra
        run: |
          pw() { openssl rand -hex 16; }
          cat > .env <<EOF
          DOMAIN=localhost
          COMPOSE_PROFILES=
          POSTGRES_DB=plita
          POSTGRES_USER=plita
          POSTGRES_PASSWORD=$(pw)
          MQTT_BACKEND_PASSWORD=$(pw)
          MQTT_DEVICE_PASSWORD=$(pw)
          JWT_SECRET=$(pw)
          GOOGLE_CLIENT_ID=
          DEV_AUTH_ENABLED=true
          EOF

      - name: Поднять связку
        working-directory: infra
        run: docker compose up -d --build

      - name: Дождаться /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/health; then echo; exit 0; fi
            sleep 5
          done
          echo "бэкенд не поднялся за 5 минут"; exit 1

      - name: Сквозная проверка
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r infra/backend/tools/requirements.txt
          set -a; . infra/.env; set +a
          .venv/bin/python infra/backend/tools/e2e_check.py --api https://localhost \
            --mqtt-host localhost --mqtt-port 1883 --mqtt-user backend --mqtt-password "$MQTT_BACKEND_PASSWORD"

      - name: Логи при ошибке
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color --tail=300 backend db mosquitto caddy

      - name: Память бэкенда
        if: always()
        run: docker stats --no-stream
